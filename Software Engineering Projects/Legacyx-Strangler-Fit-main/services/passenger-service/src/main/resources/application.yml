server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: passenger-service
  datasource:
    url: jdbc:postgresql://passenger-db:5432/passenger_db
    username: ${POSTGRES_USER:legacyx}
    # No guessable fallback — see docker-compose.yml / .env.example.
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      group-id: passenger-service
      auto-offset-reset: earliest

# No default pepper — a compromised DB with hashes but no pepper is
# still useless to an attacker without this value too.
security:
  passport-pepper: ${PASSPORT_HASH_PEPPER}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
