services:
  legacy-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legacyx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-legacy_db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - legacy-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legacyx}"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "127.0.0.1:9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  loki:
    image: grafana/loki:3.1.1
    ports:
      - "127.0.0.1:3100:3100"

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki

  legacy-monolith:
    build:
      context: ./legacy-monolith
    ports:
      - "127.0.0.1:5000:8080"
    environment:
      ConnectionStrings__LegacyDb: Host=legacy-db;Port=5432;Database=${POSTGRES_DB:-legacy_db};Username=${POSTGRES_USER:-legacyx};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — see .env.example}
      # Same pepper the Passenger Service uses. It has to be the same value,
      # not just present: the monolith now serves /api/aviation/passengers
      # too, and a passport hash written on one side of the toggle has to
      # still match one written on the other.
      Security__PassportPepper: ${PASSPORT_HASH_PEPPER:?Set PASSPORT_HASH_PEPPER in .env — see .env.example}
    depends_on:
      legacy-db:
        condition: service_healthy

  customer-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legacyx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — see .env.example}
      POSTGRES_DB: customer_db
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - customer-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legacyx}"]
      interval: 5s
      timeout: 5s
      retries: 5

  customer-service:
    build:
      context: ./services/customer-service
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legacyx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — see .env.example}
    depends_on:
      customer-db:
        condition: service_healthy

  customer-migrator:
    build:
      context: ./migration/data-migrator
    command: ["migrate_customers.py"]
    environment:
      LEGACY_DB_HOST: legacy-db
      LEGACY_DB_PORT: "5432"
      LEGACY_DB_USER: ${POSTGRES_USER:-legacyx}
      LEGACY_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — see .env.example}
      MODERN_DB_HOST: customer-db
      MODERN_DB_PORT: "5432"
      MODERN_DB_NAME: customer_db
      MODERN_DB_USER: ${POSTGRES_USER:-legacyx}
      MODERN_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — see .env.example}
    profiles: ["tools"]  # excluded from plain `docker compose up` — run explicitly, see migration/data-migrator/README.md
    depends_on:
      - legacy-db
      - customer-db

  order-migrator:
    build:
      context: ./migration/data-migrator
    command: ["migrate_orders.py"]
    environment:
      LEGACY_DB_HOST: legacy-db
      LEGACY_DB_PORT: "5432"
      LEGACY_DB_USER: ${POSTGRES_USER:-legacyx}
      LEGACY_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — see .env.example}
      MODERN_DB_HOST: order-db
      MODERN_DB_PORT: "5432"
      MODERN_DB_NAME: order_db
      MODERN_DB_USER: ${POSTGRES_USER:-legacyx}
      MODERN_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — see .env.example}
    profiles: ["tools"]
    depends_on:
      - legacy-db
      - order-db

  inventory-migrator:
    build:
      context: ./migration/data-migrator
    command: ["migrate_inventory.py"]
    environment:
      LEGACY_DB_HOST: legacy-db
      LEGACY_DB_PORT: "5432"
      LEGACY_DB_USER: ${POSTGRES_USER:-legacyx}
      LEGACY_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — see .env.example}
      MODERN_DB_HOST: inventory-db
      MODERN_DB_PORT: "5432"
      MODERN_DB_NAME: inventory_db
      MODERN_DB_USER: ${POSTGRES_USER:-legacyx}
      MODERN_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — see .env.example}
    profiles: ["tools"]
    depends_on:
      - legacy-db
      - inventory-db

  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legacyx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — see .env.example}
      POSTGRES_DB: order_db
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legacyx}"]
      interval: 5s
      timeout: 5s
      retries: 5

  order-service:
    build:
      context: ./services/order-service
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      ConnectionStrings__OrderDb: Host=order-db;Port=5432;Database=order_db;Username=${POSTGRES_USER:-legacyx};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — see .env.example}
      Kafka__BootstrapServers: kafka:9092
    depends_on:
      order-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-service:
    build:
      context: ./services/notification-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  inventory-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legacyx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — see .env.example}
      POSTGRES_DB: inventory_db
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legacyx}"]
      interval: 5s
      timeout: 5s
      retries: 5

  inventory-service:
    build:
      context: ./services/inventory-service
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legacyx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — see .env.example}
    depends_on:
      inventory-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ============================================================
  # Aviation tenant — six services, one per domain from the spec.
  # No legacy/modern toggle here (unlike the retail domains above):
  # these are the only implementation that's ever existed, so the
  # gateway always routes them "modern". See gateway/Program.cs.
  # ============================================================

  passenger-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legacyx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — see .env.example}
      POSTGRES_DB: passenger_db
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - passenger-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legacyx}"]
      interval: 5s
      timeout: 5s
      retries: 5

  passenger-service:
    build:
      context: ./services/passenger-service
    ports:
      - "127.0.0.1:8084:8080"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legacyx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — see .env.example}
      PASSPORT_HASH_PEPPER: ${PASSPORT_HASH_PEPPER:?Set PASSPORT_HASH_PEPPER in .env — see .env.example}
    depends_on:
      passenger-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  fleet-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legacyx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — see .env.example}
      POSTGRES_DB: fleet_db
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - fleet-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legacyx}"]
      interval: 5s
      timeout: 5s
      retries: 5

  fleet-service:
    build:
      context: ./services/fleet-service
    ports:
      - "127.0.0.1:8085:8080"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legacyx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — see .env.example}
      POSTGRES_HOST: fleet-db
      POSTGRES_DB: fleet_db
    depends_on:
      fleet-db:
        condition: service_healthy

  flight-scheduling-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legacyx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — see .env.example}
      POSTGRES_DB: flight_scheduling_db
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - flight-scheduling-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legacyx}"]
      interval: 5s
      timeout: 5s
      retries: 5

  flight-scheduling-service:
    build:
      context: ./services/flight-scheduling-service
    ports:
      - "127.0.0.1:8086:8080"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legacyx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — see .env.example}
    depends_on:
      flight-scheduling-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  booking-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legacyx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — see .env.example}
      POSTGRES_DB: booking_db
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - booking-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legacyx}"]
      interval: 5s
      timeout: 5s
      retries: 5

  booking-service:
    build:
      context: ./services/booking-service
    ports:
      - "127.0.0.1:8087:8080"
    environment:
      ConnectionStrings__BookingDb: Host=booking-db;Port=5432;Database=booking_db;Username=${POSTGRES_USER:-legacyx};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — see .env.example}
      Kafka__BootstrapServers: kafka:9092
    depends_on:
      booking-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  crew-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legacyx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — see .env.example}
      POSTGRES_DB: crew_db
    ports:
      - "127.0.0.1:5441:5432"
    volumes:
      - crew-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legacyx}"]
      interval: 5s
      timeout: 5s
      retries: 5

  crew-service:
    build:
      context: ./services/crew-service
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legacyx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — see .env.example}
      POSTGRES_HOST: crew-db
      POSTGRES_DB: crew_db
    depends_on:
      crew-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  baggage-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legacyx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — see .env.example}
      POSTGRES_DB: baggage_db
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - baggage-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legacyx}"]
      interval: 5s
      timeout: 5s
      retries: 5

  baggage-service:
    build:
      context: ./services/baggage-service
    ports:
      - "127.0.0.1:8089:8080"
    environment:
      ConnectionStrings__BaggageDb: Host=baggage-db;Port=5432;Database=baggage_db;Username=${POSTGRES_USER:-legacyx};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — see .env.example}
    depends_on:
      baggage-db:
        condition: service_healthy

  gateway:
    build:
      context: ./gateway
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Backends__Legacy is the shared monolith and serves BOTH tenants —
      # retail's three domains and aviation's eleven — so there's no
      # per-tenant legacy entry. Everything below is the modern side.
      # These used to be Backends__Aviation__* because aviation had no
      # legacy implementation to toggle away from; it does now, so they're
      # "modern" like retail's.
      Backends__Legacy: http://legacy-monolith:8080
      Backends__Modern__customer: http://customer-service:8080
      Backends__Modern__order: http://order-service:8080
      Backends__Modern__inventory: http://inventory-service:8080
      Backends__Modern__passengers: http://passenger-service:8080
      Backends__Modern__loyalty: http://passenger-service:8080
      Backends__Modern__aircraft: http://fleet-service:8080
      Backends__Modern__maintenance: http://fleet-service:8080
      Backends__Modern__routes: http://flight-scheduling-service:8080
      Backends__Modern__flights: http://flight-scheduling-service:8080
      Backends__Modern__bookings: http://booking-service:8080
      Backends__Modern__tickets: http://booking-service:8080
      Backends__Modern__crew: http://crew-service:8080
      Backends__Modern__assignments: http://crew-service:8080
      Backends__Modern__baggage: http://baggage-service:8080
      Auth__JwtSecret: ${JWT_SECRET:?Set JWT_SECRET in .env — see .env.example}
      Auth__AdminUsername: ${ADMIN_USERNAME:-admin}
      Auth__AdminPassword: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env — see .env.example}
      Auth__MigrationEngineerUsername: ${MIGRATION_ENGINEER_USERNAME:-migrator}
      Auth__MigrationEngineerPassword: ${MIGRATION_ENGINEER_PASSWORD:?Set MIGRATION_ENGINEER_PASSWORD in .env — see .env.example}
      Auth__OperatorUsername: ${OPERATOR_USERNAME:-operator}
      Auth__OperatorPassword: ${OPERATOR_PASSWORD:?Set OPERATOR_PASSWORD in .env — see .env.example}
      Auth__FlightDispatcherUsername: ${FLIGHT_DISPATCHER_USERNAME:-dispatcher}
      Auth__FlightDispatcherPassword: ${FLIGHT_DISPATCHER_PASSWORD:?Set FLIGHT_DISPATCHER_PASSWORD in .env — see .env.example}
      Auth__FleetManagerUsername: ${FLEET_MANAGER_USERNAME:-fleetmgr}
      Auth__FleetManagerPassword: ${FLEET_MANAGER_PASSWORD:?Set FLEET_MANAGER_PASSWORD in .env — see .env.example}
      Auth__GateAgentUsername: ${GATE_AGENT_USERNAME:-gateagent}
      Auth__GateAgentPassword: ${GATE_AGENT_PASSWORD:?Set GATE_AGENT_PASSWORD in .env — see .env.example}
      # Aviation's cutover authority — the counterparts to retail's
      # ADMIN/MIGRATION_ENGINEER. The three roles above are operational and
      # can only read the routing table.
      Auth__AviationAdminUsername: ${AVIATION_ADMIN_USERNAME:-avadmin}
      Auth__AviationAdminPassword: ${AVIATION_ADMIN_PASSWORD:?Set AVIATION_ADMIN_PASSWORD in .env — see .env.example}
      Auth__AviationMigrationEngineerUsername: ${AVIATION_MIGRATION_ENGINEER_USERNAME:-avmigrator}
      Auth__AviationMigrationEngineerPassword: ${AVIATION_MIGRATION_ENGINEER_PASSWORD:?Set AVIATION_MIGRATION_ENGINEER_PASSWORD in .env — see .env.example}
    depends_on:
      - legacy-monolith
      - customer-service
      - order-service
      - inventory-service
      - passenger-service
      - fleet-service
      - flight-scheduling-service
      - booking-service
      - crew-service
      - baggage-service

  dashboard:
    build:
      context: ./dashboard
      args:
        # 127.0.0.1, not localhost — on this host, "localhost" resolves to
        # ::1 first and Docker Desktop's IPv6 loopback forwarding for
        # published ports doesn't work, so browser fetches silently hang
        # instead of falling back. Bypassed entirely by being explicit.
        NEXT_PUBLIC_GATEWAY_URL: http://127.0.0.1:8080
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - gateway

volumes:
  legacy-db-data:
  customer-db-data:
  order-db-data:
  inventory-db-data:
  passenger-db-data:
  fleet-db-data:
  flight-scheduling-db-data:
  booking-db-data:
  crew-db-data:
  baggage-db-data:
