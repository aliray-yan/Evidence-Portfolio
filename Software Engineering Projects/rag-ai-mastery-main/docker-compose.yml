services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-ai-mastery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rag_ai_mastery
      POSTGRES_USER: rag_mastery
      POSTGRES_PASSWORD: "12345"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_mastery -d rag_ai_mastery"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
